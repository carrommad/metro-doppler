<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="doppler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <!-- Compressed approaching waves (left) & stretched receding waves (right) -->
  <path d="M16 18 A18 18 0 0 0 16 46" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 12 A24 24 0 0 0 10 52" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M46 20 A16 16 0 0 1 46 44" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M54 13 A24 24 0 0 1 54 51" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- TMB Metro Diamond + Doppler S-curve -->
  <polygon points="32,12 46,32 32,52 18,32" fill="#e2231a" stroke="#ffffff" stroke-width="2"/>
  <path d="M12 22 C 26 22, 29 26, 32 32 C 35 38, 38 42, 52 42" fill="none" stroke="url(#doppler)" stroke-width="4" stroke-linecap="round"/>
</svg>
